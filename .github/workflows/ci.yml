name: HeatLab CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-video.txt
      - name: Install and check dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-video.txt
          python -m pip check
      - name: Run unit and dashboard tests
        run: python -m pytest -q
      - name: Generate a scientific report
        run: |
          python -m heatlab.scientific_reporting --output "$RUNNER_TEMP/heatlab-validation"
          python -m zipfile -t "$RUNNER_TEMP/heatlab-validation/HeatLab2D-Validation-Data.zip"
